<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شاشة إقامة الصلاة - موقع الويب (نسخة الاختبار)</title>
    <style>
        /* شاشة سوداء تماماً وخالصة */
        body, html { 
            background-color: #000000; 
            margin: 0; 
            padding: 0;
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        #content-container {
            display: flex; 
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            color: #ffffff; 
        }

        .overlay {
            width: 100%; height: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            text-align: center;
            padding-bottom: 12vh; /* مساحة الأمان لرفع المحتوى ومنع تداخله مع الأسفل */
        }

        /* تنسيق أيقونة المسجد (ذات الـ 3 قباب) */
        .mosque-icon {
            width: 15vw; 
            max-width: 190px;
            margin-bottom: 20px;
            opacity: 0.95;
        }
        
        .clock { font-size: 7vw; font-weight: bold; color: #ffffff; margin-bottom: 5px; direction: ltr; }
        .date-info { font-size: 1.8vw; color: #ffffff; margin-bottom: 20px; line-height: 1.5; }
        
        .times-container {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
        }
        
        .time-box {
            background: rgba(255,255,255,0.1); 
            padding: 15px 30px; 
            border-radius: 10px; 
            border: 1px solid #ffffff;
            text-align: center;
        }
        .time-box .ar { font-size: 2.2vw; color: #ffffff; font-weight: bold; }
        .time-box .en { font-size: 1.5vw; color: #ffffff; direction: ltr; margin-top: 8px; }
        
        .prayer-info { margin: 5px 0; color: #ffffff; }
        .prayer-info .ar { font-size: 3vw; font-weight: bold; }
        .prayer-info .en { font-size: 2vw; direction: ltr; margin-top: 5px; }
        
        .iqamah-timer { 
            margin: 5px 0 12vh 0; /* إبقاء العداد والرسالة مرفوعين للأعلى */
            min-height: 12vw; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        
        .timer-display { 
            color: #ffff00; /* اللون الأصفر */
            font-weight: bold; 
            transition: all 0.3s ease;
            line-height: 1.2;
        }

        .footer { 
            font-size: 1.2vw; 
            color: #666; 
            position: absolute; 
            bottom: 20px; 
            width: 100%; 
            text-align: center; 
            line-height: 1.6;
            background-color: #000000; 
            padding: 5px 0;
        }
    </style>
</head>
<body>

    <div id="content-container">
        <div class="overlay">
            
            <!-- تصميم المسجد المتوازن (3 قباب متداخلة، مئذنتين، أبواب مقوسة) -->
            <svg class="mosque-icon" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                <g fill="#ffffff">
                    <!-- قاعدة المسجد الأساسية -->
                    <rect x="10" y="85" width="100" height="10" rx="2" />
                    
                    <!-- القبة اليسرى -->
                    <path d="M 20 85 C 20 65, 45 65, 45 85 Z" />
                    <rect x="32" y="55" width="1" height="10" />
                    <path d="M 32.5 48 A 4 4 0 1 1 28.5 52 A 5 5 0 1 0 32.5 48 Z" />

                    <!-- القبة اليمنى -->
                    <path d="M 75 85 C 75 65, 100 65, 100 85 Z" />
                    <rect x="87" y="55" width="1" height="10" />
                    <path d="M 87.5 48 A 4 4 0 1 1 83.5 52 A 5 5 0 1 0 87.5 48 Z" />

                    <!-- القبة الرئيسية الكبرى في المنتصف (تغطي على الجانبيتين قليلاً) -->
                    <path d="M 40 85 C 40 45, 80 45, 80 85 Z" />
                    <rect x="59.5" y="32" width="1" height="15" />
                    <path d="M 60 23 A 6 6 0 1 1 54 29 A 7 7 0 1 0 60 23 Z" />

                    <!-- المئذنة اليسرى -->
                    <rect x="12" y="35" width="6" height="50" rx="1" />
                    <polygon points="12,35 18,35 15,20" />
                    <rect x="10" y="50" width="10" height="2" rx="1" />
                    <rect x="10" y="65" width="10" height="2" rx="1" />
                    <rect x="14.5" y="13" width="1" height="7" />
                    <path d="M 15 7 A 3 3 0 1 1 12 10 A 3.5 3.5 0 1 0 15 7 Z" />

                    <!-- المئذنة اليمنى -->
                    <rect x="102" y="35" width="6" height="50" rx="1" />
                    <polygon points="102,35 108,35 105,20" />
                    <rect x="100" y="50" width="10" height="2" rx="1" />
                    <rect x="100" y="65" width="10" height="2" rx="1" />
                    <rect x="104.5" y="13" width="1" height="7" />
                    <path d="M 105 7 A 3 3 0 1 1 102 10 A 3.5 3.5 0 1 0 105 7 Z" />
                    
                    <!-- الأبواب المقوسة (مفرغة باللون الأسود لتظهر بتفاصيل رائعة) -->
                    <path d="M 54 95 L 54 83 A 6 6 0 0 1 66 83 L 66 95 Z" fill="#000000" />
                    <path d="M 28 95 L 28 88 A 4 4 0 0 1 36 88 L 36 95 Z" fill="#000000" />
                    <path d="M 84 95 L 84 88 A 4 4 0 0 1 92 88 L 92 95 Z" fill="#000000" />
                </g>
            </svg>

            <div class="clock" id="current-time">00:00:00</div>
            <div class="date-info">
                <div id="date-ar">جاري التحضير...</div>
                <div id="date-en" dir="ltr">Loading...</div>
            </div>
            
            <div class="times-container">
                <div class="time-box">
                    <div class="ar" id="adhan-time-ar">وقت الأذان: --:--</div>
                    <div class="en" id="adhan-time-en">Adhan Time: --:--</div>
                </div>
                <div class="time-box">
                    <div class="ar" id="iqamah-time-ar">وقت الإقامة: --:--</div>
                    <div class="en" id="iqamah-time-en">Iqamah Time: --:--</div>
                </div>
            </div>
            
            <div class="prayer-info">
                <div class="ar" id="prayer-info-ar"></div>
                <div class="en" id="prayer-info-en"></div>
            </div>
            
            <div class="iqamah-timer">
                <div class="timer-display" id="dynamic-display"></div>
            </div>
            
            <div class="footer">
                الموقع: جبل علي، دبي (نسخة تجريبية للموقع) | تحديث المواقيت يتم تلقائياً<br>
                <span dir="ltr">Location: Jebel Ali, Dubai (Web Test Mode) | Timings updated automatically</span>
            </div>
        </div>
    </div>
